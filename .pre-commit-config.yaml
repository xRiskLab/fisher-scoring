repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.11
    hooks:
      - id: uv-lock

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]  # keep Markdown hard line breaks
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0  # keep in sync with ruff in uv.lock
    hooks:
      - id: ruff-check
        args: [--fix, --target-version=py39]
      - id: ruff-format
        args: [--target-version=py39]

  # Run mypy from the project environment (same versions and config as CI).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy fisher_scoring/
        language: system
        pass_filenames: false
        files: ^fisher_scoring/
