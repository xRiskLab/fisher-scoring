[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fisher-scoring"
dynamic = ["version"]
description = "A Python implementation of the Fisher Scoring algorithm for proportion and incidence rate modeling."
authors = [
    { name = "xRiskLab", email = "contact@xrisklab.ai" }
]
license = "MIT"
readme = "README.md"
keywords = ["fisher scoring", "logistic regression", "maximum likelihood", "classification", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.19.5,<2.0.0",
    "pandas>=2.2.2,<3.0.0",
    "scikit-learn>=1.3.0,<2.0.0",
]

[project.urls]
Repository = "https://github.com/xRiskLab/fisher-scoring"
Homepage = "https://github.com/xRiskLab/fisher-scoring"

[dependency-groups]
dev = [
    "matplotlib>=3.0.0,<4.0.0",
    "black>=24.4.2,<25.0.0",
    "isort>=5.13.2,<6.0.0",
    "pylint>=3.2.6,<4.0.0",
    "pytest>=8.3.2,<9.0.0",
    "rich>=13.7.1,<14.0.0",
    "fixit>=2.1.0,<3.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pydocstyle>=6.3.0,<7.0.0",
    "docformatter>=1.7.5,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "pandas-stubs>=2.2.2.240807",
    "scikit-learn-stubs>=0.0.3",
    "jupyter>=1.1.1",
    "statsmodels>=0.14.6",
]

[tool.hatch.version]
path = "fisher_scoring/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fisher_scoring"]

[tool.hatch.build.targets.sdist]
include = [
    "/fisher_scoring",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.uv]
default-groups = ["dev"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.pylint.'MESSAGES CONTROL']
disable = ["C0413", "C0103", "E0213"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "rich.*",
    "scipy.special.*",
    "scipy.stats.*",
    "scipy.optimize.*",
    "sklearn.*",
    "matplotlib.*",
]
ignore_missing_imports = true

[tool.pydocstyle]
convention = "google"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
